name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4
      - name: Accept Android Licenses
        run: |
          SDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK/tools/bin
          if [ -d "$SDK/cmdline-tools/latest/bin" ]; then
            cp $SDK/cmdline-tools/latest/bin/* $SDK/tools/bin/
          fi
          yes | $SDK/tools/bin/sdkmanager --licenses || true
      - name: Build APK
        run: |
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mini-apk
          path: bin/*.apk
